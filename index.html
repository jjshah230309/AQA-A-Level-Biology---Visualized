'use strict';
/* ===================== 10 CORE: maths, PRNG, noise, inks ===================== */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
const rad = d => d * PI / 180;

function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return (h ^ h >>> 16) >>> 0;
}
const mix2 = (a, b) => { let h = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x7F4A7C15, 0xC2B2AE35); h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; return h >>> 0; };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function inkMask(s) { let m = 0; for (let i = 0; i < s.length; i++) { const k = INK[s[i]]; if (k) m |= k.bit; } return m; }

/* 1-D value-noise lattice, cubic-smoothed. Fills Float32Array `a` with values in [-1,1]. */
function fillLattice(rng, n, closed) {
  const a = new Float32Array(n + 3);
  for (let i = 0; i < n; i++) a[i] = rng() * 2 - 1;
  if (closed) { a[n] = a[0]; a[n + 1] = a[1]; a[n + 2] = a[2]; }
  else { a[n] = rng() * 2 - 1; a[n + 1] = rng() * 2 - 1; a[n + 2] = rng() * 2 - 1; }
  return a;
}
function lat(a, x) {
  const i = x | 0, f = x - i, t = f * f * (3 - 2 * f);
  return a[i] + (a[i + 1] - a[i]) * t;
}

/* Poly utilities */
function polyArea(p) { let a = 0; for (let i = 0, n = p.length; i < n; i += 2) { const j = (i + 2) % n; a += p[i] * p[j + 1] - p[j] * p[i + 1]; } return a / 2; }
function pointInPoly(x, y, p) {
  let c = false;
  for (let i = 0, n = p.length, j = n - 2; i < n; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
/* Catmull-Rom resample. pts flat [x,y,...]; returns flat array with ~`sp` spacing */
function catmull(p, closed, sp) {
  const n = p.length / 2;
  if (n < 2) return p.slice();
  const out = [];
  const get = (i) => {
    if (closed) { i = ((i % n) + n) % n; } else { i = i < 0 ? 0 : i >= n ? n - 1 : i; }
    return [p[i * 2], p[i * 2 + 1]];
  };
  const segs = closed ? n : n - 1;
  for (let s = 0; s < segs; s++) {
    const p0 = get(s - 1), p1 = get(s), p2 = get(s + 1), p3 = get(s + 2);
    const L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const k = Math.max(1, Math.ceil(L / sp));
    for (let j = 0; j < k; j++) {
      const t = j / k, t2 = t * t, t3 = t2 * t;
      out.push(
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3));
    }
  }
  if (!closed) out.push(p[(n - 1) * 2], p[(n - 1) * 2 + 1]);
  return out;
}
/* straight-segment densify */
function densify(p, closed, sp) {
  const n = p.length / 2, out = [];
  const segs = closed ? n : n - 1;
  for (let s = 0; s < segs; s++) {
    const a = s * 2, b = ((s + 1) % n) * 2;
    const L = Math.hypot(p[b] - p[a], p[b + 1] - p[a + 1]);
    const k = Math.max(1, Math.ceil(L / sp));
    for (let j = 0; j < k; j++) { const t = j / k; out.push(p[a] + (p[b] - p[a]) * t, p[a + 1] + (p[b + 1] - p[a + 1]) * t); }
  }
  if (!closed) out.push(p[(n - 1) * 2], p[(n - 1) * 2 + 1]);
  return out;
}

  fill(sc) {

      (c.eq ? '<div class="e"><i>' + esc(c.skill || 'Equation') + '</i>' + c.eq + (c.eqn ? '<small>' + c.eqn + '</small>' : '') + '</div>' : '') +
      (c.q ? '<details class="q"><summary>' + (c.q) + '</summary>' + (c.a || '') + '</details>' : '') +

/* ===================== 24 LIB TOKENS: compact monomer glyphs, reaction helpers ===================== */
const hexPts = (x, y, r, rot = 0.5) => { const p = []; for (let k = 0; k < 6; k++) p.push(x + Math.cos(k * TAU / 6 + rot) * r, y + Math.sin(k * TAU / 6 + rot) * r); return p; };
const polyPts = (x, y, r, n, rot = -PI / 2) => { const p = []; for (let k = 0; k < n; k++) p.push(x + Math.cos(k * TAU / n + rot) * r, y + Math.sin(k * TAU / n + rot) * r); return p; };
/* monosaccharide hexagon token */
Recorder.prototype.tokSugar = function (x, y, r, o = {}) {
  const ink = o.fi || 'Y';
  this.poly(hexPts(x, y, r), { ink: 'B', w: o.w || 1.1, fi: ink, ft: o.ft === undefined ? 0.75 : o.ft, wob: 0.18 });
  if (o.o !== false) this.circle(x + r * 0.35, y - r * 0.35, r * 0.17, { ink: 'B', w: 0.7, fi: 'T', ft: 0.9 });
  return this;
};
/* amino-acid token: disc (backbone) + R-group lobe in colour rc ('T','Y','P','TY') on side */
Recorder.prototype.tokAmino = function (x, y, r, o = {}) {
  const rc = o.rc || 'T', up = o.up === undefined ? -1 : o.up;
  this.circle(x, y + up * r * 1.45, r * 0.62, { ink: 'B', w: 0.9, fi: rc, ft: 0.85 });
  this.line(x, y + up * r * 0.85, x, y + up * r * 1.0, { ink: 'B', w: 0.8, taper: 'none' });
  this.circle(x, y, r, { ink: 'B', w: o.w || 1.1, fi: 'P', ft: 0.6 });
  this.text('N-C', x, y + r * 0.28, r * 0.68, { ink: 'B', al: 'c' });
  return this;
};
Recorder.prototype.tokNT = function (x, y, s, o = {}) {
  const bc = { A: 'P', T: 'T', U: 'T', G: 'Y', C: 'TY' }[o.base || 'A'];
  this.circle(x, y - s * 0.95, s * 0.36, { ink: 'B', w: 0.9, fi: 'Y', ft: 1 });
  this.line(x, y - s * 0.6, x, y - s * 0.4, { ink: 'B', w: 0.8, taper: 'none' });
  this.poly(polyPts(x, y, s * 0.46, 5), { ink: 'B', w: 1.0, fi: 'P', ft: 0.25 });
  this.line(x + s * 0.4, y, x + s * 0.62, y, { ink: 'B', w: 0.8, taper: 'none' });
  this.rect(x + s * 0.62, y - s * 0.3, s * 0.7, s * 0.6, { ink: 'B', w: 0.9, fi: bc, ft: 0.8, wob: 0.1 });
  return this;
};
/* bond highlight: pink ring around a covalent bond site */
Recorder.prototype.bondMark = function (x, y, r = 3.4, o = {}) { this.circle(x, y, r, { ink: o.ink || 'P', w: o.w || 1.3, wob: 0.12 }); return this; };
/* small water droplet token */
Recorder.prototype.drop = function (x, y, s, o = {}) {
  const p = [x, y - s * 1.1, x + s * 0.55, y - s * 0.1, x + s * 0.5, y + s * 0.45, x, y + s * 0.8, x - s * 0.5, y + s * 0.45, x - s * 0.55, y - s * 0.1];
  this.poly(p, { ink: 'B', w: o.w || 0.9, fi: 'T', ft: o.ft || 0.7, smooth: true });
  if (o.label !== false) this.text(o.label || 'H_2O', x, y + s * 0.38, s * 0.62, { ink: 'B', al: 'c' });
  return this;
};
/* chain of tokens along a line; fn(R,x,y,i) draws each, bonds drawn between */
Recorder.prototype.chain = function (x, y, n, dx, dy, fn, o = {}) {
  for (let i = 0; i < n - 1; i++) this.line(x + dx * i, y + dy * i, x + dx * (i + 1), y + dy * (i + 1), { ink: 'B', w: o.w || 1.2, taper: 'none', wob: 0.15 });
  const kr = o.kr === undefined ? 8 : o.kr;
  for (let i = 0; i < n; i++) { if (kr > 0) this.knock(polyPts(x + dx * i, y + dy * i, kr, 10)); fn(this, x + dx * i, y + dy * i, i); }
  if (o.bonds) for (let i = 0; i < n - 1; i++) this.bondMark(x + dx * (i + 0.5), y + dy * (i + 0.5), o.br || 2.6);
  return this;
};
/* simple card-style callout number bubble */
Recorder.prototype.bubble = function (x, y, r, str, o = {}) { this.circle(x, y, r, { ink: 'B', w: 1.0, fi: o.fi || 'P', ft: o.ft || 0.35 }); this.text(str, x, y + r * 0.34, r * 0.95, { ink: 'B', al: 'c' }); return this; };

/* ===================== 25 LIB RP: required-practical window template =====================
   Every RP scene shows the same nine facets so the audience can compare them:
   principle + apparatus + measurement (zone A), interpretation (zone B), variables + controls (C1),
   calculation (C2), risks (C3), limitations (C4).  Methods are always labelled as an EXAMPLE
   (the specification leaves the choice of method to schools).                                      */
const RP_FACETS = ['principle', 'variables', 'controls', 'apparatus', 'measurement', 'calculation', 'risk', 'limitation', 'interpretation'];
function wrapText(str, maxW, size) {
  const words = String(str).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (cur && labelWidth(t, size) > maxW) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function rpScene(d) {
  const sc = {
    id: d.id, num: d.num, rp: d.rp, title: d.title, sub: d.sub, topic: d.topic, slot: d.slot, span: d.span, dna: d.dna || 'mark', ao: 3,
    covers: d.covers, card: d.card, at: d.at, ms: d.ms, ps: d.ps,
    rpFacets: { principle: !!d.apparatus, variables: !!(d.vars && d.vars.iv), controls: !!(d.vars && d.vars.ctl && d.vars.ctl.length), apparatus: !!d.apparatus, measurement: !!(d.vars && d.vars.dv), calculation: !!(d.calc && d.calc.length), risk: !!(d.risks && d.risks.length), limitation: !!(d.limits && d.limits.length), interpretation: !!d.interp },
    draw(R, s) {

      R.line(184, 14, 184, 144, { ink: 'B', w: 0.5, t: 0.6, taper: 'none' });
      d.results(R, { x: 192, y: 12, w: 120, h: 118 });
      wrapText(d.interp, 122, 4.0).slice(0, 2).forEach((t, i) => R.text(t, 252, 137 + i * 5.6, 4.0, { al: 'c' }));
      R.line(8, 148, 312, 148, { ink: 'B', w: 0.5, t: 0.6, taper: 'none' });
      // C1 variables / controls
      const v = d.vars; let y = 156;
      const block = (icon, head, lines) => { Icons[icon](R, 16, y + 5, 5.2); R.text(head, 26, y + 1.4, 3.9, { al: 'l' }); lines.forEach((t, i) => R.text(t, 26, y + 7.6 + i * 5.4, 4.4, { al: 'l' })); y += 16 + Math.max(0, lines.length - 1) * 5.4; };
      block('knob', 'independent', wrapText(v.iv, 72, 4.4));
      block('gauge', 'dependent', wrapText(v.dv, 72, 4.4));
      block('lock', 'controlled', v.ctl.flatMap(t => wrapText(t, 72, 4.4)).slice(0, 4));
      R.line(104, 152, 104, 230, { ink: 'B', w: 0.5, t: 0.6, taper: 'none' });
      // C2 calculation
      R.text('calculation', 110, 160, 4.4, { al: 'l' }); R.text('\u03A3', 148, 160, 5.4, { al: 'l', ink: 'P' });
      let cy = 172; d.calc.forEach(t => { wrapText(t, 92, 5).forEach(ln => { R.text(ln, 110, cy, 5, { al: 'l' }); cy += 9; }); });
      R.line(204, 152, 204, 230, { ink: 'B', w: 0.5, t: 0.6, taper: 'none' });
      // C3 risks
      R.text('risk', 232, 160, 4.4, { al: 'c' });
      let ry = 170; d.risks.slice(0, 3).forEach(r => { Icons[r[0]](R, 214, ry + 3, 5.2); const ls = wrapText(r[1], 38, 3.9); ls.slice(0, 3).forEach((t, i) => R.text(t, 223, ry + 2 + i * 5, 3.9, { al: 'l' })); ry += 14 + Math.max(0, ls.length - 1) * 5; });
      R.line(262, 152, 262, 230, { ink: 'B', w: 0.5, t: 0.6, taper: 'none' });
      // C4 limitations
      Icons.warn(R, 272, 160, 4.4); R.text('limits', 281, 162, 4.4, { al: 'l' });
      let ly = 173; d.limits.slice(0, 4).forEach(t => { const ls = wrapText(t, 44, 3.9); R.dot(266, ly - 1.2, 0.7, { ink: 'P' }); ls.forEach((ln, i) => R.text(ln, 269, ly + i * 4.8, 3.9, { al: 'l' })); ly += 5.4 + ls.length * 4.8; });
      Icons.errbar(R, 276, 224, 4.2); Icons.repeat(R, 294, 224, 3.8);

/* ATP synthase embedded in a membrane at (x,y) (centre of the membrane). s = scale. dir: 1 head below the membrane, -1 above */
Recorder.prototype.atpSynthase = function (x, y, s = 1, o = {}) {
  const R = this, d = o.dir === undefined ? 1 : o.dir;
  R.rrect(x - 5 * s, y - 6 * s, 10 * s, 12 * s, 2.5 * s, { ink: 'B', w: 1.1, fi: 'P', ft: 0.7, wob: 0.15 });      // F0 rotor/channel in membrane

  R.line(x - 2.2 * s, y + d * 15 * s, x + 2.2 * s, y + d * 19 * s, { ink: 'B', w: 0.7, taper: 'none' });
  return { top: [x, y - d * 6 * s], head: [x, y + d * 17 * s] };
};

function blockHeader(R, L, o = {}) {

/* A meandering hand-drawn conduit through the gutter between window rows */

/* base colours used everywhere: A pink, T teal, G yellow, C green(teal+yellow), U teal-light */
const BASE_INK = { A: 'P', T: 'T', U: 'T', G: 'Y', C: 'TY' };
Recorder.prototype.baseBox = function (x, y, base, o = {}) { // purine (A,G) larger than pyrimidine (C,T,U)
  const big = base === 'A' || base === 'G', w = (o.w || 9) * (big ? 1.25 : 0.9), h = o.h || 7;
  this.fill(roundBox(x, y, w, h), { ink: BASE_INK[base], t: base === 'U' ? 0.45 : 0.8, wob: 0.1 }); this.rect(x, y, w, h, { ink: 'B', w: 0.9, wob: 0.12 });
  this.text(base, x + w / 2, y + h * 0.72, h * 0.8, { ink: 'B', al: 'c' });
  return w;
};
/* pentose with O at top; labelled carbons optional; c2: 'H' (deoxyribose) or 'OH' (ribose) */
Recorder.prototype.pentose = function (cx, cy, r, c2, o = {}) {
  const R = this, p = polyPts(cx, cy, r, 5), fs = r * 0.5;
  R.poly(p, { ink: 'B', w: 1.1, fi: 'P', ft: 0.28 });
  R.text('O', p[0], p[1] + fs * 0.35, fs, { al: 'c' });
  // 2' carbon is the lower-left vertex (index 3), 3' lower-right? use p[6],p[7] as C2'
  const c2p = [p[6], p[7]];
  R.line(c2p[0], c2p[1], c2p[0] - r * 0.1, c2p[1] + r * 0.55, { ink: 'B', w: 0.9, taper: 'none' });
  R.text(c2, c2p[0] - r * 0.1, c2p[1] + r * 0.55 + fs * 1.05, fs, { al: 'c' });
  if (c2 === 'OH' && o.ring !== false) R.ellipse(c2p[0] - r * 0.1, c2p[1] + r * 0.55 + fs * 0.7, fs * 1.35, fs * 0.85, { ink: 'P', w: 1, wob: 0.1 });
  return { p, c2p };
};
